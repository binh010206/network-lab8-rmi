# Local rehearsal only: two standalone MongoDB processes, separate volumes.
services:
  mongo1:
    image: mongo:8.0.4
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo1:/data/db"]
  mongo2:
    image: mongo:8.0.4
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo2:/data/db"]
volumes:
  mongo1:
  mongo2:
